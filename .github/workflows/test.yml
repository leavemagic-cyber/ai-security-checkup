name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test
      - name: Inspect running Node metadata on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Inspect-RunningNode.ps1
      - name: Build and test Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./windows/Build.ps1
      - name: Upload Windows helper
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-helper
          if-no-files-found: error
          path: |
            local/windows-build/SecurityCheckup.exe
            local/windows-build/README.zh-TW.txt
            local/windows-build/SHA256SUMS.txt
            local/windows-build/self-test.txt
